    <style>
      :root {
        /* ── Manuscript & Brass palette ── */
        --bg-color:            #FBF5EA;
        --card-color:          #F4E9D6;

        /* ── Brand Colors ── */
        --primary-color:       #33251A;
        --accent-color:        #8A4A1C;

        /* ── Text ── */
        --text-heading:        #241C14;
        --text-card-heading:   #241C14;
        --text-main:           #241C14;
        --text-content:        #241C14;
        --text-muted:          #574636;

        /* ── Borders & Shadows ── */
        --glass-border:        #E0CFB0;
        --premium-shadow:      0 4px 24px rgba(51, 37, 26, 0.08);

        /* ── Typography ── */
        --font-heading:        'Bricolage Grotesque', system-ui, sans-serif;
        --font-body:           'IBM Plex Sans', system-ui, sans-serif;
        --font-price:          'IBM Plex Sans', system-ui, sans-serif;
        --font-sans:           var(--font-body);
        --font-serif:          var(--font-heading);

        /* ── Layout ── */
        --container-public:    90rem;
        --page-pad-x:          1rem;
      }

      @media (min-width: 640px) {
        :root { --page-pad-x: 1.5rem; }
      }

      @media (min-width: 1024px) {
        :root { --page-pad-x: 3rem; }
      }

      .font-price,
      .price-hero,
      .price-tag-v2,
      .price-amount,
      .csc-price {
        font-family: var(--font-price);
        font-variant-numeric: tabular-nums lining-nums;
        font-feature-settings: 'tnum' 1, 'lnum' 1;
        letter-spacing: -0.02em;
      }

      body {
        overflow-x: hidden;
      }

      .text-gradient {
        background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>
